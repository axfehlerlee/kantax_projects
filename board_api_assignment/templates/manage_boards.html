{% extends "base.html" %}{% block title %}게시판 관리{% endblock %}{% block page %}manage{% endblock %}{% block content %}<div id="manage-page" hidden><header class="detail-header"><p class="detail-kicker">ADMIN / BOARDS</p><h1>게시판 관리</h1><p>생성·수정·삭제는 관리자만 가능합니다. 서버에서 권한을 검사합니다.</p></header><div class="manage-grid" id="admin-panel" hidden><section><h2>게시판 목록</h2><label class="inline-label"><input type="checkbox" id="include-deleted"> 삭제된 게시판도 포함</label><p>삭제 상태는 목록 응답에 포함되지 않습니다. 삭제된 게시판은 상세 조회·편집할 수 없으며 ID를 재사용할 수 없습니다.</p><ul id="manage-list" class="comment-list"></ul></section><section><h2 id="manage-heading">새 게시판</h2><button type="button" id="manage-new">새로 만들기</button><form id="board-form" class="editor-form"><label>게시판 ID<input name="board_id" minlength="2" maxlength="30" required><small>영문 소문자로 시작하는 2~30자 식별자</small></label><label>게시판 이름<input name="board_name" maxlength="50" required></label><label>페이지 크기<input name="page_size" type="number" min="1" max="100" value="20" required></label><label>게시글 작성·수정·삭제<select name="edit_role"><option value="ALL">누구나</option><option value="USER">회원 이상</option><option value="ADMIN">관리자</option></select></label><label>게시글 상세 조회<select name="view_role"><option value="ALL">누구나</option><option value="USER">회원 이상</option><option value="ADMIN">관리자</option></select></label><label>게시글 목록 조회<select name="list_role"><option value="ALL">누구나</option><option value="USER">회원 이상</option><option value="ADMIN">관리자</option></select></label><label>댓글 조회<select name="comment_list_role"><option value="ALL">누구나</option><option value="USER">회원 이상</option><option value="ADMIN">관리자</option></select></label><label>댓글 작성·수정·삭제<select name="comment_edit_role"><option value="ALL">누구나</option><option value="USER">회원 이상</option><option value="ADMIN">관리자</option></select></label><div class="action-row"><button class="primary" type="submit">저장 ↗</button><button type="button" id="board-delete" hidden>게시판 삭제</button></div></form></section></div><p id="page-status" role="status"></p></div>{% endblock %}
